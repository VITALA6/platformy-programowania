spring.application.name=library

# Domyślny profil: dev (H2 w pamięci). Postgres: profil "postgres" (docker compose up -d).
spring.profiles.default=dev

# Thymeleaf: bez cache, żeby zmiany w szablonach były widoczne od razu (devtools)
spring.thymeleaf.cache=false

# Pokazuj SQL generowany przez Hibernate (przydatne w labach 5-7)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Lab 7: wzorzec Open Session In View - świadomie zdecyduj, czy ma być włączony
# spring.jpa.open-in-view=false
