# H2 w pamięci - baza znika po restarcie aplikacji
spring.datasource.url=jdbc:h2:mem:library
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Konsola H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:library)
spring.h2.console.enabled=true

# Tylko localhost: konsola H2 pozwala wykonać dowolny kod, nie wystawiaj jej w sieci (np. na uczelnianym Wi-Fi)
server.address=127.0.0.1
spring.h2.console.settings.web-allow-others=false
